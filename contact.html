<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 min-h-screen flex flex-col font-sans">
  <noscript><div style="padding:12px;text-align:center;background:#fef3c7;color:#92400e;font-family:sans-serif">JavaScript is required to use Fixlytools. Please enable JavaScript in your browser.</div></noscript>
  <header class="sticky top-0 z-40 bg-white/90 dark:bg-slate-900/90 backdrop-blur border-b border-slate-200 dark:border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2.5 font-bold text-xl text-blue-600 dark:text-blue-400">
        <i class="fa-solid fa-wrench text-2xl"></i>
        <span>Fixlytools</span>
      </a>
      <nav class="hidden md:flex items-center gap-6 text-sm font-medium text-slate-600 dark:text-slate-300">
        <a href="/#image-tools" class="hover:text-blue-600">Image Tools</a>
        <a href="/#pdf-tools" class="hover:text-blue-600">PDF Tools</a>
        <a href="/#dev-tools" class="hover:text-blue-600">Developer & Math</a>
        <a href="/about" class="hover:text-blue-600">About</a>
        <a href="/contact" class="text-blue-600 font-semibold">Contact</a>
      </nav>
      <div class="flex items-center gap-3">
        <button class="theme-toggle p-2 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">
          <i class="fa-solid fa-moon dark:hidden"></i>
          <i class="fa-solid fa-sun hidden dark:block text-amber-400"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="flex-grow max-w-3xl mx-auto px-4 sm:px-6 py-12 w-full">
    <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 sm:p-10 shadow-sm border border-slate-200 dark:border-slate-700">
      <h1 class="text-3xl font-extrabold text-slate-900 dark:text-white mb-2">Contact Us</h1>
      <p class="text-slate-600 dark:text-slate-300 mb-8">Have a question, feedback, or tool suggestion? We'd love to hear from you.</p>

      <form id="contact-form" class="space-y-5">
        <!-- Web3Forms Access Key -->
        <input type="hidden" name="access_key" value="3983a5e1-8a73-4585-87a6-ec4aef01c407">
        <input type="hidden" name="from_name" value="Fixlytools Website">
        <input type="checkbox" name="botcheck" class="hidden" style="display: none;">

        <div>
          <label class="block text-sm font-semibold text-slate-700 dark:text-slate-200 mb-1.5" for="name">Your Name</label>
          <input type="text" id="name" name="name" required placeholder="John Doe" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 dark:text-slate-200 mb-1.5" for="email">Email Address</label>
          <input type="email" id="email" name="email" required placeholder="john@example.com" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 dark:text-slate-200 mb-1.5" for="subject">Subject</label>
          <input type="text" id="subject" name="subject" required placeholder="Tool suggestion or question" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 dark:text-slate-200 mb-1.5" for="message">Message</label>
          <textarea id="message" name="message" rows="5" required placeholder="Type your message here..." class="w-full px-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
        </div>
        <button type="submit" id="submit-btn" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow transition-colors flex items-center justify-center gap-2">
          <i class="fa-solid fa-paper-plane text-sm"></i>
          <span id="btn-text">Send Message</span>
        </button>
      </form>

      <div class="mt-8 pt-8 border-t border-slate-200 dark:border-slate-700 text-center text-sm text-slate-500 dark:text-slate-400">
        <p>Direct Support Email: <a href="mailto:support@fixlytools.com" class="text-blue-600 font-medium">support@fixlytools.com</a></p>
      </div>
    </div>

  <footer class="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 py-8 text-sm text-slate-500 dark:text-slate-400">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-2">
        <i class="fa-solid fa-wrench text-blue-600"></i>
        <span>Fixlytools &copy; 2026</span>
      </div>
      <div class="flex items-center gap-6">
        <a href="/privacy-policy" class="hover:text-blue-600">Privacy Policy</a>
        <a href="/terms" class="hover:text-blue-600">Terms of Service</a>
        <a href="/about" class="hover:text-blue-600">About Us</a>
        <a href="/contact" class="hover:text-blue-600">Contact</a>
      </div>
    </div>
  </footer>

  <script src="/assets/js/app.js"></script>
  <script>
    const contactForm = document.getElementById('contact-form');
    const submitBtn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');

    contactForm.addEventListener('submit', async function(e) {
      e.preventDefault();
      
      submitBtn.disabled = true;
      btnText.textContent = 'Sending...';

      const formData = new FormData(contactForm);
      const object = Object.fromEntries(formData);
      const json = JSON.stringify(object);

      try {
        const response = await fetch('https://api.web3forms.com/submit', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: json
        });

        const result = await response.json();
        if (result.success) {
          showToast('Thank you! Your message has been sent successfully.', 'success');
          contactForm.reset();
        } else {
          console.error('Web3Forms error:', result);
          showToast('Could not send message. Please try again or email support@fixlytools.com.', 'error');
        }
      } catch (err) {
        console.error('Contact form network error:', err);
        showToast('Network error: your message was NOT sent. Please email support@fixlytools.com instead.', 'error');
      } finally {
        submitBtn.disabled = false;
        btnText.textContent = 'Send Message';
      }
    });
  </script>
